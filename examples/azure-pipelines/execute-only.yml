# Example: execute an Azure Chaos Studio scenario configuration WITHOUT starting a
# new validation (execute-only). Use this when a prior stage already validated the
# configuration. The task waits for a terminal run state and reports the outcome.
#
# Auth is workload-identity federation (WIF) via an ARM service connection — NO
# long-lived secret (NFR3). Prerequisite: install the "Azure Chaos Studio
# Workspaces" extension so AzureChaosStudioScenario@1 is available.

trigger: none

pool:
  vmImage: ubuntu-latest

steps:
  - task: AzureChaosStudioScenario@1
    displayName: Execute the scenario configuration
    name: chaos   # run-id is present after success; guard optional outputs per README
    inputs:
      azureSubscription: chaos-studio-wif   # ARM service connection (workload identity)
      subscriptionId: $(chaosSubscriptionId)
      resourceGroup: rg-chaos
      workspaceName: ws-demo
      scenarioName: scn-demo
      scenarioConfigurationName: cfg-demo
      mode: execute-only
      waitForCompletion: true
