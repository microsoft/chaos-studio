# Example: validate a Chaos Studio scenario configuration only (never execute).
#
# Use validate-only as a pre-flight / PR gate: the step passes iff validation
# reaches the terminal `Succeeded` state and fails on RequiresAttention /
# NoResolvedResources. No run is started.
#
# Authenticates with workload identity federation (WIF) via azure/login — NO
# long-lived secret (NFR3). Third-party actions are pinned to a full commit SHA.
#
# TEMPLATE — not yet copy-paste runnable: the all-zero microsoft/chaos-studio
# SHA below is a non-resolving sentinel. Replace it with a published preview
# release's full commit SHA before running. See ./README.md.
name: Chaos Studio — validate only

on:
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    # Configure this environment with required reviewers and scope the
    # federated credential subject to the environment.
    environment: chaos-validation
    # Fork PRs must use a separate unprivileged validation workflow.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (workload identity)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate the scenario configuration
        uses: microsoft/chaos-studio@0000000000000000000000000000000000000000 # v1 — non-resolving template sentinel; replace after preview publication
        with:
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group: rg-chaos
          workspace-name: ws-demo
          scenario-name: scn-demo
          scenario-configuration-name: cfg-demo
          mode: validate-only
