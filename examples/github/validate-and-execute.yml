# Example: validate AND execute a Chaos Studio scenario configuration (default mode).
#
# Authenticates with workload identity federation (WIF) via azure/login — there is
# NO long-lived client secret (NFR3); GitHub mints a short-lived OIDC token that
# azure/login exchanges for an Azure CLI session, which the Action reuses.
#
# All third-party actions are pinned to a full commit SHA (supply-chain hardening).
#
# TEMPLATE — not yet copy-paste runnable: the all-zero microsoft/chaos-studio
# SHA below is a non-resolving sentinel. Replace it with a published preview
# release's full commit SHA before running. See ./README.md.
name: Chaos Studio — validate and execute

on:
  workflow_dispatch:

permissions:
  id-token: write # required for WIF OIDC token minting
  contents: read

jobs:
  chaos:
    runs-on: ubuntu-latest
    # Reserve the default 2700s completion-timeout-seconds PLUS the fixed 300s
    # cleanup budget the step uses on timeout/cancellation, plus overhead — a
    # tighter job timeout can kill the job mid-cleanup and leave the run going.
    timeout-minutes: 55
    steps:
      # WIF login — client-id/tenant-id/subscription-id are IDENTIFIERS, not secrets.
      - name: Azure login (workload identity)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate and execute the scenario
        uses: microsoft/chaos-studio@0000000000000000000000000000000000000000 # v1 — non-resolving template sentinel; replace after preview publication
        with:
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group: rg-chaos
          workspace-name: ws-demo
          scenario-name: scn-demo
          scenario-configuration-name: cfg-demo
          mode: validate-and-execute
          # Waits for a terminal run state and cancels the run on timeout/cancellation.
          wait-for-completion: 'true'
